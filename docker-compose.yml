services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      # simplechat.sql creates "SimpleChat"; table/db names are case-sensitive on Linux
      MYSQL_DATABASE: SimpleChat
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./simplechat.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/nhatpham12/simplechat-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_NAME: SimpleChat
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: ghcr.io/nhatpham12/simplechat-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
